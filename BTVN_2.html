<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN_2</title>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Mono+One&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>
            COFFEE STUDY
        </h2>
        <nav>
            <a href="#">TRANG CHU</a>
            <a href="#">MENU</a>
            <a href="#">LIEN HE</a>
        </nav>
    </header>
    <main>
        <div class="wrap_section">
            <section>
                <h3>BẠN MUỐN TÌM MỘT CHỖ ĐỂ CHẠY DEADLINE HỌC TẬP</h3>
                <p>Hãy đến với chúng tôi nơi cung cấp không gian học tập cùng giá cả sinh viên</p>
            </section>
            <section>
                <h3>Còn chừng chừ điều gì mà không đến với chúng tôi</h3>
                <video width="640" height="360" controls>
                    <source src="1.mp4" type="video/mp4">
                </video>
            </section>
        </div>
        <form>
            <h3>Hỗ trợ tư vấn</h3>
            <div class="wrap_form">
                <label for="name">Tên khách hàng: </label>
                <input type="text" id="name" placeholder="Nguyễn Văn A" required>
            </div>
            <div class="wrap_form">
                <label for="sdt">SĐT :</label>
                <input type="text" id="sdt" placeholder="084xxxxxxxxxx" required>
            </div>
            <div class="wrap_form">
                <label for="email">Email</label>
                <input type="email" required>
            </div>
            <div class="wrap_form">
                <label for="comment">Yêu cầu tư vấn :</label>
                <textarea name="comment" id="comment" rows="5" placeholder="Commit"></textarea>
            </div>
            <div class="button">Xác nhận thông tin </div>
        </form>
    </main>
    <footer>
        <p>Địa điểm: 12, Nguyễn Văn Bảo, Hạnh Thông,TPHCM</p>
        <nav>
            <div class="face"><img src="akar-icons_facebook-fill.svg" alt="facebook">
            </div>
            <div class="tiktok"><img src="selfhst_tiktok.svg" alt="tiktok"></div>
        </nav>
    </footer>
</body>
</html>
